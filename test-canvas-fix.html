<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas小人测试</title>
    <style>
        body {
            background: #0d0d1a;
            color: #e0e0ff;
            font-family: monospace;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #ffc040;
            text-align: center;
        }
        .test-area {
            background: #1e1e2e;
            border: 2px solid #4040ff;
            padding: 20px;
            margin: 20px 0;
        }
        canvas {
            border: 1px solid #4040ff;
            display: block;
            margin: 0 auto;
        }
        .info {
            background: #2d2d44;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #40c0ff;
        }
        button {
            background: #4040ff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: #6060ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Canvas小人显示测试</h1>
        
        <div class="test-area">
            <h2>测试Canvas</h2>
            <canvas id="testCanvas" width="640" height="160"></canvas>
            
            <div class="info">
                <p><strong>测试说明：</strong></p>
                <p>这个测试页面验证小人角色在Canvas中的显示是否正常。</p>
                <p>修复了椭圆中心位置和垂直半径，确保小人不会超出Canvas边界。</p>
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="testWith6Players()">测试6个玩家</button>
                <button onclick="testWith3Players()">测试3个玩家</button>
                <button onclick="testWith1Player()">测试1个玩家</button>
                <button onclick="clearCanvas()">清空画布</button>
            </div>
        </div>
        
        <div class="info">
            <h3>修复内容：</h3>
            <ul>
                <li>椭圆中心位置：cy = 80（原来220）</li>
                <li>垂直半径：ry = 50（原来100）</li>
                <li>添加了边界检查，确保小人在Canvas范围内</li>
                <li>调整了桌面弧线位置</li>
            </ul>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        // 颜色常量
        const COLORS = {
            bg: '#0d0d1a',
            blue: '#4040ff',
            red: '#ff4040',
            green: '#40c040',
            gray: '#41436a',
            skin: '#deb887',
            text: '#e0e0ff'
        };

        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        // 设置Canvas尺寸
        function setupCanvas() {
            canvas.width = 640 * dpr;
            canvas.height = 160 * dpr;
            canvas.style.width = '640px';
            canvas.style.height = '160px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // 清空画布
        function clearCanvas() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, 640, 160);
            updateStatus('画布已清空');
        }

        // 绘制桌面弧线
        function drawTableArc() {
            ctx.save();
            ctx.strokeStyle = COLORS.gray;
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            const radiusX = 640 / 2 - 40;
            ctx.ellipse(640 / 2, 80, radiusX, 50, 0, Math.PI, 0);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        // 绘制单个小人
        function drawPlayer(x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            
            // 身体
            ctx.fillStyle = color;
            ctx.fillRect(-8, -10, 16, 20);
            
            // 身体高光
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(-8, -10, 4, 20);
            
            // 头
            ctx.fillStyle = COLORS.skin;
            ctx.fillRect(-6, -24, 12, 12);
            
            // 头发
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(-6, -24, 12, 5);
            
            // 眼睛
            ctx.fillStyle = '#000';
            ctx.fillRect(-3, -17, 2, 2);
            ctx.fillRect(1, -17, 2, 2);
            
            // 腿
            ctx.fillStyle = '#2a2a3a';
            ctx.fillRect(-6, 10, 5, 8);
            ctx.fillRect(1, 10, 5, 8);
            
            // 手臂
            ctx.fillStyle = COLORS.skin;
            ctx.fillRect(-11, -6, 3, 10);
            ctx.fillRect(8, -6, 3, 10);
            
            ctx.restore();
        }

        // 计算小人位置
        function calculatePositions(count) {
            const positions = [];
            const w = 640;
            const h = 160;
            const padding = 30;
            const usableW = w - padding * 2;
            
            const cx = w / 2;
            const cy = 80;
            const rx = usableW / 2;
            const ry = 50;
            
            for (let i = 0; i < count; i++) {
                const t = count > 1 ? (i / (count - 1)) * Math.PI : Math.PI / 2;
                const angle = Math.PI - t;
                let x = cx + rx * Math.cos(angle);
                let y = cy - ry * Math.sin(angle);
                
                // 边界检查
                x = Math.max(padding, Math.min(w - padding, x));
                y = Math.max(40, Math.min(h - 40, y));
                
                positions.push({ x, y });
            }
            
            return positions;
        }

        // 测试6个玩家
        function testWith6Players() {
            clearCanvas();
            drawTableArc();
            
            const colors = [COLORS.blue, COLORS.red, COLORS.green, COLORS.gray, COLORS.blue, COLORS.red];
            const positions = calculatePositions(6);
            
            positions.forEach((pos, i) => {
                drawPlayer(pos.x, pos.y, colors[i]);
            });
            
            updateStatus('已绘制6个小人，位置：' + JSON.stringify(positions.map(p => ({x: Math.round(p.x), y: Math.round(p.y)}))));
        }

        // 测试3个玩家
        function testWith3Players() {
            clearCanvas();
            drawTableArc();
            
            const colors = [COLORS.blue, COLORS.red, COLORS.green];
            const positions = calculatePositions(3);
            
            positions.forEach((pos, i) => {
                drawPlayer(pos.x, pos.y, colors[i]);
            });
            
            updateStatus('已绘制3个小人，位置：' + JSON.stringify(positions.map(p => ({x: Math.round(p.x), y: Math.round(p.y)}))));
        }

        // 测试1个玩家
        function testWith1Player() {
            clearCanvas();
            drawTableArc();
            
            const positions = calculatePositions(1);
            drawPlayer(positions[0].x, positions[0].y, COLORS.blue);
            
            updateStatus('已绘制1个小人，位置：' + JSON.stringify({x: Math.round(positions[0].x), y: Math.round(positions[0].y)}));
        }

        // 更新状态
        function updateStatus(message) {
            document.getElementById('status').innerHTML = `
                <div class="info">
                    <p><strong>状态：</strong> ${message}</p>
                    <p><strong>Canvas尺寸：</strong> 640 x 160</p>
                    <p><strong>椭圆中心：</strong> cy = 80</p>
                    <p><strong>垂直半径：</strong> ry = 50</p>
                </div>
            `;
        }

        // 初始化
        setupCanvas();
        clearCanvas();
        testWith6Players();
    </script>
</body>
</html>
