<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆豆百米赛</title>
  <link rel="stylesheet" href="/css/duel-room.css?v=20260722-5">
  <style>
    :root {
      --ink: #263238;
      --paper: #fff8e6;
      --track: #f2754f;
      --track-dark: #cf4d3c;
      --mint: #5bc8a7;
      --blue: #58a6e7;
      --red: #f05c6a;
      --gold: #ffd166;
      --line: rgba(38, 50, 56, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 209, 102, 0.45), transparent 28%),
        radial-gradient(circle at 85% 12%, rgba(91, 200, 167, 0.35), transparent 26%),
        linear-gradient(180deg, #fff3ca 0%, #ffe3bd 45%, #fbd0a2 100%);
    }

    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 16px;
      color: rgba(38, 50, 56, 0.72);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      color: #fff;
      background: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(38, 50, 56, 0.18);
      transition: transform 140ms ease, box-shadow 140ms ease;
      white-space: nowrap;
    }

    .game-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 10px 18px;
      color: var(--ink);
      background: rgba(255, 248, 230, 0.78);
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 7px 0 rgba(38, 50, 56, 0.14);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(38, 50, 56, 0.16);
    }

    button:disabled {
      opacity: 0.58;
      cursor: wait;
      transform: none;
    }

    input,
    select {
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.68);
      font: inherit;
      font-weight: 800;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
    }

    .arena {
      position: relative;
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 8px;
      background:
        radial-gradient(circle at 12% 28%, rgba(255, 209, 102, 0.28) 0 34px, transparent 35px),
        radial-gradient(circle at 84% 62%, rgba(91, 200, 167, 0.24) 0 42px, transparent 43px),
        linear-gradient(180deg, #7ed3aa 0%, #65be96 100%);
      box-shadow: 0 18px 0 rgba(38, 50, 56, 0.16);
    }

    .arena.env-clear_track {
      background:
        radial-gradient(circle at 12% 28%, rgba(255, 209, 102, 0.30) 0 34px, transparent 35px),
        linear-gradient(180deg, #87d7ad 0%, #66bf96 100%);
    }

    .arena::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .arena.env-clear_track::after {
      opacity: 1;
      background:
        radial-gradient(circle at 8% 18%, rgba(255, 209, 102, 0.58) 0 22px, transparent 23px),
        repeating-linear-gradient(90deg, transparent 0 86px, rgba(255,255,255,0.13) 87px 90px, transparent 91px 172px);
    }

    .arena.env-tailwind::after {
      opacity: 1;
      background:
        radial-gradient(ellipse 520px 32px at 12% 28%, rgba(255,255,255,0.52), transparent 72%),
        radial-gradient(ellipse 620px 42px at 48% 62%, rgba(88,166,231,0.36), transparent 74%),
        radial-gradient(ellipse 460px 26px at 78% 42%, rgba(91,200,167,0.32), transparent 72%);
      background-size: 1200px 100%, 900px 100%, 760px 100%;
      animation: wind-sweep 2200ms linear infinite;
    }

    .arena.env-wet_track {
      background:
        radial-gradient(ellipse at 24% 32%, rgba(88, 166, 231, 0.28) 0 7%, transparent 8%),
        radial-gradient(ellipse at 72% 68%, rgba(255,255,255,0.22) 0 8%, transparent 9%),
        linear-gradient(180deg, #75bdd0 0%, #5fb49b 100%);
    }

    .arena.env-wet_track::after {
      opacity: 1;
      background:
        radial-gradient(ellipse at 18% 34%, rgba(255,255,255,0.42) 0 8%, transparent 9%),
        radial-gradient(ellipse at 56% 67%, rgba(255,255,255,0.34) 0 7%, transparent 8%),
        radial-gradient(ellipse at 82% 36%, rgba(88, 166, 231, 0.40) 0 9%, transparent 10%),
        repeating-linear-gradient(12deg, rgba(255,255,255,0.22) 0 3px, transparent 3px 18px);
      animation: wet-shimmer 1100ms ease-in-out infinite alternate;
    }

    .arena.env-loud_crowd::after {
      opacity: 1;
      background:
        radial-gradient(circle at 8% 18%, var(--gold) 0 7px, transparent 8px),
        radial-gradient(circle at 18% 82%, var(--mint) 0 6px, transparent 7px),
        radial-gradient(circle at 88% 22%, #fff 0 6px, transparent 7px),
        radial-gradient(circle at 78% 74%, var(--blue) 0 7px, transparent 8px),
        radial-gradient(circle at 48% 20%, #ff9fb0 0 5px, transparent 6px),
        repeating-linear-gradient(90deg, transparent 0 34px, rgba(255, 209, 102, 0.34) 35px 39px, transparent 40px 76px);
      animation: cheer-pop 700ms ease-in-out infinite alternate;
    }

    @keyframes wind-sweep {
      from { background-position: -420px 0, -260px 0, -160px 0; }
      to { background-position: 780px 0, 640px 0, 600px 0; }
    }

    @keyframes cheer-pop {
      from { opacity: 0.62; }
      to { opacity: 1; }
    }

    @keyframes wet-shimmer {
      from { opacity: 0.70; filter: brightness(1); }
      to { opacity: 1; filter: brightness(1.18); }
    }

    .distance-labels {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 8px 72px 6px 28px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      font-weight: 800;
    }

    .lane {
      position: relative;
      height: 132px;
      border-top: 2px dashed rgba(255, 248, 230, 0.28);
      background:
        radial-gradient(circle at 14% 28%, rgba(255,255,255,0.14) 0 8px, transparent 9px),
        radial-gradient(circle at 74% 70%, rgba(255,255,255,0.10) 0 7px, transparent 8px),
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
    }

    .arena.env-tailwind .lane {
      background:
        radial-gradient(ellipse 260px 18px at 24% 34%, rgba(255,255,255,0.24), transparent 68%),
        linear-gradient(90deg, rgba(255,255,255,0.12), transparent 58%);
    }

    .arena.env-wet_track .lane {
      border-top-color: rgba(255,255,255,0.62);
      background:
        radial-gradient(ellipse at 22% 42%, rgba(255,255,255,0.26) 0 7%, transparent 8%),
        radial-gradient(ellipse at 72% 62%, rgba(88,166,231,0.26) 0 8%, transparent 9%),
        linear-gradient(180deg, rgba(88,166,231,0.22), rgba(255,255,255,0.04));
    }

    .arena.env-loud_crowd .lane {
      background:
        radial-gradient(circle at 18% 30%, rgba(255,209,102,0.34) 0 7px, transparent 8px),
        radial-gradient(circle at 82% 64%, rgba(91,200,167,0.28) 0 7px, transparent 8px),
        linear-gradient(180deg, rgba(255,209,102,0.14), rgba(91,200,167,0.10));
    }

    .lane:last-child {
      border-bottom: 2px dashed rgba(255, 248, 230, 0.28);
    }

    .course-layer {
      position: absolute;
      left: 54px;
      right: 58px;
      top: 10px;
      bottom: 12px;
      z-index: 2;
      pointer-events: none;
    }

    .course-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .track-bed,
    .track-edge,
    .course-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .track-edge {
      stroke: rgba(38, 50, 56, 0.58);
      stroke-width: 58;
    }

    .track-bed {
      stroke: rgba(236, 105, 72, 0.98);
      stroke-width: 46;
    }

    .track-inner {
      fill: none;
      stroke: rgba(255, 248, 230, 0.72);
      stroke-width: 34;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.48;
    }

    .course-path {
      stroke: rgba(255, 248, 230, 0.76);
      stroke-width: 4;
      stroke-dasharray: 7 8;
    }

    .route-turn {
      position: absolute;
      width: 13px;
      height: 13px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--gold);
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .route-finish {
      position: absolute;
      width: 16px;
      height: 66px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background:
        repeating-linear-gradient(180deg, #fff 0 10px, var(--ink) 10px 20px);
      transform: translate(-50%, -50%);
      z-index: 5;
      box-shadow: 0 4px 0 rgba(38, 50, 56, 0.18);
    }

    .obstacle {
      position: absolute;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 5px 0 rgba(38, 50, 56, 0.22));
      z-index: 6;
    }

    .obstacle::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border: 3px solid rgba(255, 248, 230, 0.70);
      border-radius: 50%;
      background: rgba(255, 209, 102, 0.16);
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .obstacle.is-hit::before {
      animation: obstacle-ring 620ms ease-out;
    }

    .obstacle.hurdle {
      width: 34px;
      height: 46px;
      border-left: 7px solid var(--ink);
      border-right: 7px solid var(--ink);
    }

    .obstacle.hurdle::before {
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 209, 102, 0.18);
      transform: translate(-50%, -50%);
    }

    .obstacle.hurdle::after {
      content: "";
      position: absolute;
      left: -14px;
      right: -14px;
      top: 10px;
      height: 9px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--gold);
    }

    .obstacle.puddle {
      width: 62px;
      height: 34px;
      border: 4px solid rgba(38, 50, 56, 0.36);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 34% 35%, rgba(255,255,255,0.82) 0 14%, transparent 15%),
        radial-gradient(ellipse at 68% 62%, rgba(255,255,255,0.42) 0 10%, transparent 11%),
        rgba(88, 166, 231, 0.74);
    }

    .obstacle.cone {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-bottom: 48px solid var(--gold);
    }

    .obstacle.cone::after {
      content: "";
      position: absolute;
      left: -23px;
      top: 36px;
      width: 46px;
      height: 10px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
    }

    .obstacle.flash-hop,
    .obstacle.flash-clean,
    .obstacle.flash-dodge {
      animation: obstacle-success 620ms ease-out;
    }

    .obstacle.flash-splash {
      animation: obstacle-splash-hit 700ms ease-out;
    }

    .obstacle.flash-slip,
    .obstacle.flash-stumble {
      animation: obstacle-danger 760ms ease-out;
    }

    .runner {
      position: absolute;
      left: 20px;
      top: 30px;
      width: 68px;
      height: 68px;
      transform: translateX(0);
      transition: transform 45ms linear;
      z-index: 3;
    }

    .runner::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 4px solid var(--ink);
      border-radius: 50% 50% 46% 46%;
      background: var(--blue);
      box-shadow: inset -10px -10px 0 rgba(0,0,0,0.08);
    }

    .runner.red::before {
      background: var(--red);
    }

    .runner::after {
      content: none;
    }

    .face {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .eye,
    .mouth,
    .brow {
      position: absolute;
      background: var(--ink);
    }

    .eye {
      top: 40%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .eye.left {
      left: 32%;
    }

    .eye.right {
      right: 32%;
    }

    .mouth {
      left: 50%;
      top: 65%;
      width: 14px;
      height: 4px;
      border-radius: 999px;
      transform: translateX(-50%);
    }

    .brow {
      top: 31%;
      width: 14px;
      height: 4px;
      border-radius: 999px;
      opacity: 0;
    }

    .brow.left {
      left: 25%;
    }

    .brow.right {
      right: 25%;
    }

    .runner.mood-strain .eye {
      height: 4px;
      border-radius: 999px;
      transform: translateY(2px);
    }

    .runner.mood-strain .mouth {
      width: 9px;
      height: 9px;
      top: 61%;
      border-radius: 50%;
    }

    .runner.mood-strain .face::before {
      content: "";
      position: absolute;
      right: 21%;
      top: 25%;
      width: 7px;
      height: 11px;
      border-radius: 70% 70% 70% 12%;
      background: rgba(88, 166, 231, 0.78);
      transform: rotate(18deg);
    }

    .runner.mood-angry .brow {
      opacity: 1;
    }

    .runner.mood-angry .brow.left {
      transform: rotate(18deg);
    }

    .runner.mood-angry .brow.right {
      transform: rotate(-18deg);
    }

    .runner.mood-angry .mouth {
      top: 66%;
      width: 16px;
      height: 4px;
    }

    .runner.mood-angry .face::after {
      content: "";
      position: absolute;
      left: 22%;
      top: 55%;
      width: 9px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 104, 132, 0.38);
      box-shadow: 25px 0 0 rgba(255, 104, 132, 0.38);
    }

    .runner.mood-happy .eye {
      height: 4px;
      border-radius: 999px;
    }

    .runner.mood-happy .mouth {
      top: 58%;
      width: 18px;
      height: 11px;
      border: 4px solid var(--ink);
      border-top: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      background: transparent;
      border-radius: 0 0 999px 999px;
    }

    .runner.mood-happy .face::before {
      content: "";
      position: absolute;
      right: 17%;
      top: 16%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow:
        -34px 7px 0 -2px rgba(255, 209, 102, 0.82),
        -17px -6px 0 -3px rgba(255, 209, 102, 0.78);
    }

    .runner.mood-shame .eye {
      width: 6px;
      height: 6px;
      transform: translateY(3px);
    }

    .runner.mood-shame .mouth {
      top: 67%;
      width: 13px;
      height: 4px;
    }

    .runner.mood-shame .face::after {
      content: "";
      position: absolute;
      left: 25%;
      top: 53%;
      width: 8px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 104, 132, 0.48);
      box-shadow: 24px 0 0 rgba(255, 104, 132, 0.48);
    }

    .runner.mood-shame .face::before {
      content: "";
      position: absolute;
      right: 23%;
      top: 42%;
      width: 5px;
      height: 11px;
      border-radius: 999px;
      background: rgba(88, 166, 231, 0.72);
    }

    .runner.mood-taunt .eye.left {
      height: 4px;
      border-radius: 999px;
      transform: translateY(1px) rotate(-8deg);
    }

    .runner.mood-taunt .eye.right {
      height: 9px;
      transform: translateY(-1px);
    }

    .runner.mood-taunt .brow {
      opacity: 1;
      width: 13px;
    }

    .runner.mood-taunt .brow.left {
      transform: rotate(-12deg);
    }

    .runner.mood-taunt .brow.right {
      transform: rotate(16deg);
    }

    .runner.mood-taunt .mouth {
      top: 62%;
      width: 18px;
      height: 9px;
      border: 4px solid var(--ink);
      border-top: 0;
      border-left-color: transparent;
      background: transparent;
      border-radius: 0 0 999px 999px;
      transform: translateX(-45%) rotate(-8deg);
    }

    .runner.mood-panic .eye {
      width: 10px;
      height: 10px;
      background: #fff;
      border: 3px solid var(--ink);
    }

    .runner.mood-panic .mouth {
      top: 62%;
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .runner.mood-panic .face::before {
      content: "";
      position: absolute;
      right: 17%;
      top: 20%;
      width: 8px;
      height: 14px;
      border-radius: 70% 70% 70% 12%;
      background: rgba(88, 166, 231, 0.82);
      transform: rotate(18deg);
    }

    .runner.mood-determined .brow {
      opacity: 1;
      width: 15px;
    }

    .runner.mood-determined .brow.left {
      transform: rotate(14deg) translateY(1px);
    }

    .runner.mood-determined .brow.right {
      transform: rotate(-14deg) translateY(1px);
    }

    .runner.mood-determined .eye {
      height: 5px;
      border-radius: 999px;
      transform: translateY(2px);
    }

    .runner.mood-determined .mouth {
      top: 66%;
      width: 20px;
      height: 6px;
      border-radius: 999px;
    }

    .runner.mood-proud .eye.left {
      height: 4px;
      border-radius: 999px;
      transform: rotate(8deg);
    }

    .runner.mood-proud .eye.right {
      height: 4px;
      border-radius: 999px;
      transform: rotate(-8deg);
    }

    .runner.mood-proud .mouth {
      top: 59%;
      width: 20px;
      height: 12px;
      border: 4px solid var(--ink);
      border-top: 0;
      border-left-color: transparent;
      border-right-color: transparent;
      background: transparent;
      border-radius: 0 0 999px 999px;
    }

    .runner.mood-proud .face::after {
      content: "";
      position: absolute;
      left: 18%;
      top: 18%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 35px 0 0 -1px rgba(255, 209, 102, 0.84);
    }

    .runner.mood-shocked .eye {
      width: 11px;
      height: 11px;
      background: #fff;
      border: 3px solid var(--ink);
    }

    .runner.mood-shocked .mouth {
      top: 62%;
      width: 18px;
      height: 12px;
      border: 4px solid var(--ink);
      background: transparent;
      border-radius: 50%;
    }

    .runner.mood-shocked .face::after {
      content: "!";
      position: absolute;
      right: 13%;
      top: 9%;
      color: var(--gold);
      font-size: 20px;
      font-weight: 900;
      -webkit-text-stroke: 2px var(--ink);
    }

    .runner.mood-dizzy .eye {
      width: 12px;
      height: 12px;
      border: 3px solid var(--ink);
      background: transparent;
      border-radius: 50%;
    }

    .runner.mood-dizzy .eye.left::after,
    .runner.mood-dizzy .eye.right::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 4px;
      width: 8px;
      height: 3px;
      border-radius: 999px;
      background: var(--ink);
      transform: rotate(42deg);
    }

    .runner.mood-dizzy .eye.right::after {
      transform: rotate(-42deg);
    }

    .runner.mood-dizzy .mouth {
      top: 67%;
      width: 17px;
      height: 5px;
      transform: translateX(-50%) rotate(-7deg);
    }

    .runner.mood-dizzy .face::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 12%;
      width: 9px;
      height: 9px;
      border: 3px solid var(--gold);
      border-right-color: transparent;
      border-radius: 50%;
      box-shadow: 32px -4px 0 -2px rgba(255, 209, 102, 0.72);
    }

    .runner.running {
      animation: bob 180ms infinite alternate ease-in-out;
    }

    .runner.winner::before {
      animation: winner-glow 620ms ease-out 2;
      box-shadow:
        0 0 0 8px rgba(255, 209, 102, 0.76),
        0 0 0 16px rgba(255, 209, 102, 0.24),
        inset -10px -10px 0 rgba(0,0,0,0.08);
    }

    .runner.winner .face {
      animation: victory-hop 520ms ease-out 2;
    }

    .runner.action-hop::before,
    .runner.action-hop .face {
      animation: obstacle-hop 520ms ease-out;
    }

    .runner.action-dodge::before,
    .runner.action-dodge .face {
      animation: obstacle-dodge 520ms ease-out;
    }

    .runner.action-clean::before,
    .runner.action-clean .face {
      animation: obstacle-clean 520ms ease-out;
    }

    .runner.action-splash::before,
    .runner.action-splash .face {
      animation: obstacle-splash 520ms ease-out;
    }

    .runner.action-slip::before,
    .runner.action-slip .face,
    .runner.action-stumble::before,
    .runner.action-stumble .face {
      animation: obstacle-stumble 620ms ease-out;
    }

    @keyframes bob {
      from { margin-top: 0; }
      to { margin-top: -7px; }
    }

    @keyframes victory-hop {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-9px); }
    }

    @keyframes winner-glow {
      0% { transform: scale(1); }
      45% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes obstacle-hop {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-20px) scale(1.04); }
    }

    @keyframes obstacle-dodge {
      0%, 100% { transform: translateX(0) rotate(0); }
      35% { transform: translateX(-12px) rotate(-8deg); }
      70% { transform: translateX(8px) rotate(6deg); }
    }

    @keyframes obstacle-clean {
      0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
      45% { transform: translateY(-7px) scale(1.05); filter: brightness(1.18); }
    }

    @keyframes obstacle-splash {
      0%, 100% { transform: translateY(0) rotate(0); }
      35% { transform: translateY(5px) rotate(-3deg); }
      70% { transform: translateY(-7px) rotate(4deg); }
    }

    @keyframes obstacle-stumble {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      18% { transform: translate(7px, 5px) rotate(10deg); }
      38% { transform: translate(-5px, -2px) rotate(-8deg); }
      62% { transform: translate(3px, 3px) rotate(5deg); }
    }

    @keyframes obstacle-ring {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.86); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
    }

    @keyframes obstacle-success {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0); filter: drop-shadow(0 5px 0 rgba(38, 50, 56, 0.22)); }
      45% { transform: translate(-50%, -58%) scale(1.18) rotate(-4deg); filter: drop-shadow(0 10px 0 rgba(38, 50, 56, 0.14)) brightness(1.18); }
    }

    @keyframes obstacle-splash-hit {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      35% { transform: translate(-50%, -50%) scale(1.25, 0.88); }
      65% { transform: translate(-50%, -54%) scale(1.08); filter: saturate(1.25); }
    }

    @keyframes obstacle-danger {
      0%, 100% { transform: translate(-50%, -50%) rotate(0); }
      18% { transform: translate(-45%, -49%) rotate(9deg); }
      38% { transform: translate(-55%, -52%) rotate(-11deg); }
      62% { transform: translate(-48%, -48%) rotate(5deg); }
    }

    .effect-pop {
      position: absolute;
      z-index: 8;
      min-width: 68px;
      padding: 7px 10px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: rgba(255, 248, 230, 0.95);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, -120%);
      animation: effect-pop 780ms ease-out forwards;
      pointer-events: none;
    }

    .effect-pop.bad {
      background: rgba(255, 104, 132, 0.95);
      color: #fff;
    }

    .effect-pop.good {
      background: rgba(255, 209, 102, 0.96);
    }

    @keyframes effect-pop {
      from { opacity: 0; transform: translate(-50%, -70%) scale(0.86); }
      25% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -170%) scale(1.04); }
    }

    .finish {
      display: none;
    }

    .nameplate {
      position: absolute;
      left: 18px;
      bottom: 10px;
      z-index: 4;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 248, 230, 0.86);
      font-size: 13px;
      font-weight: 900;
    }

    .nameplate span {
      color: rgba(38, 50, 56, 0.62);
      font-weight: 800;
    }

    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 16px;
      background: rgba(255, 248, 230, 0.78);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .stat {
      border-radius: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.58);
    }

    .builder {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      margin-top: 24px;
    }

    .points {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--gold);
      font-weight: 900;
    }

    .points.is-over {
      background: var(--red);
      color: #fff;
    }

    .builder-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .stat-controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-control {
      border: 3px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: rgba(255,255,255,0.42);
    }

    .stat-control strong {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .stepper {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 8px;
    }

    .stepper button {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      box-shadow: 0 5px 0 rgba(38, 50, 56, 0.16);
    }

    .stepper span {
      min-width: 44px;
      text-align: center;
      border-radius: 999px;
      padding: 8px 10px;
      background: #fff;
      font-weight: 900;
    }

    .strategy-grid {
      display: grid;
      gap: 12px;
    }

    .created-trait {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(91, 200, 167, 0.24);
      font-weight: 900;
    }

    .environment-badge {
      margin-top: 12px;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: rgba(255, 209, 102, 0.34);
      font-weight: 900;
    }

    .event-log {
      margin-top: 18px;
      min-height: 64px;
      font-weight: 800;
      color: rgba(38, 50, 56, 0.8);
    }

    .result {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 900;
    }

    .recap {
      margin-top: 12px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 249, 232, 0.9);
      font-size: 14px;
      line-height: 1.55;
    }

    .recap-title {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 16px;
    }

    .recap p {
      margin: 4px 0;
    }

    .event-log strong {
      display: inline-block;
      margin-right: 8px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--gold);
      color: var(--ink);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      header,
      .panel,
      .builder {
        grid-template-columns: 1fr;
        display: grid;
      }

      header {
        align-items: start;
      }

      .lane {
        height: 118px;
      }

      .distance-labels {
        padding-right: 52px;
      }

      .stat-controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .arena {
        border-width: 3px;
        box-shadow: 0 10px 0 rgba(38, 50, 56, 0.14);
      }

      .distance-labels {
        padding: 7px 42px 5px 14px;
        font-size: 9px;
      }

      .lane {
        height: 106px;
      }

      .runner {
        top: 24px;
        width: 58px;
        height: 58px;
      }

      .nameplate {
        left: 8px;
        bottom: 5px;
        max-width: calc(100% - 16px);
        padding: 5px 8px;
        overflow: hidden;
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .builder,
      .panel {
        gap: 12px;
        margin-top: 16px;
      }

      .card {
        padding: 12px;
      }

      .builder-head {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .points {
        padding: 6px 9px;
        font-size: 12px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-log {
        min-height: 52px;
        margin-top: 14px;
        font-size: 13px;
      }

      .result {
        margin-top: 12px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>豆豆百米赛</h1>
        <p class="subtitle">两名玩家各配一位豆豆选手，同场看完 100m 冲线。</p>
      </div>
      <div class="header-actions">
        <a class="game-link" href="/games/dumpling-sumo/">团子相扑</a>
        <a class="game-link" href="/">返回大厅</a>
        <button id="raceBtn" type="button" disabled>提交配置并准备</button>
      </div>
    </header>

    <section class="duel-room-dock" aria-label="双人房间">
      <div class="duel-room-fields">
        <label>你的昵称<input id="duelPlayerName" maxlength="10" autocomplete="nickname"></label>
        <label>邀请码<input id="duelRoomId" placeholder="加入朋友房间时填写" maxlength="20" autocomplete="off"></label>
      </div>
      <div class="duel-room-actions">
        <button id="createDuelBtn" type="button">快速开房</button>
        <button id="joinDuelBtn" type="button" class="is-secondary">按邀请码加入</button>
        <div id="joinedDuelActions" class="duel-joined-actions hidden">
          <button id="shareDuelBtn" type="button">复制邀请链接</button>
          <button id="leaveDuelBtn" type="button" class="is-danger">离开房间</button>
        </div>
      </div>
      <div class="duel-room-status">
        <span id="duelStatusText">先进房，再调好选手等对手。</span>
        <div id="duelSeats" class="duel-seats" aria-live="polite"></div>
      </div>
      <button id="cancelReadyBtn" class="duel-cancel-ready hidden" type="button">取消准备，继续调整</button>
    </section>

    <nav class="post-match-actions hidden" id="postMatchActions" aria-label="本局结束后操作">
      <a class="post-match-lobby" href="/">
        <strong>返回游戏大厅</strong>
        <small>换个玩法，或加入新的房间</small>
      </a>
      <button class="post-match-rematch" id="postMatchRematch" type="button">
        <strong>调整配置再来一局</strong>
        <small>调整选手配置后重新准备</small>
      </button>
    </nav>

    <section class="arena" aria-label="race replay">
      <div class="distance-labels">
        <span>0m</span><span>20m</span><span>40m</span><span>60m</span><span>80m</span><span>100m</span>
      </div>
      <div class="finish" aria-hidden="true"></div>
      <div class="lane">
        <div class="course-layer" id="courseLayerA" aria-hidden="true"></div>
        <div class="runner blue mood-focus" id="runnerA">
          <span class="face" aria-hidden="true">
            <i class="brow left"></i><i class="brow right"></i>
            <i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </span>
        </div>
        <div class="nameplate" id="nameA">小蓝兔 <span>等待中</span></div>
      </div>
      <div class="lane">
        <div class="course-layer" id="courseLayerB" aria-hidden="true"></div>
        <div class="runner red mood-focus" id="runnerB">
          <span class="face" aria-hidden="true">
            <i class="brow left"></i><i class="brow right"></i>
            <i class="eye left"></i><i class="eye right"></i><i class="mouth"></i>
          </span>
        </div>
        <div class="nameplate" id="nameB">红豆 <span>等待中</span></div>
      </div>
    </section>

    <section class="builder">
      <article class="card">
        <div class="builder-head">
          <h2>创建选手</h2>
          <div class="points" id="pointsBadge">点数 36 / 36</div>
        </div>
        <label>
          名字
          <input id="runnerName" maxlength="20" value="">
        </label>
        <div class="stat-controls" id="statControls"></div>
        <div class="created-trait" id="createdTrait">天赋：开跑时随机生成</div>
        <div class="environment-badge" id="environmentBadge">赛场：开跑后生成</div>
      </article>
      <article class="card">
        <h2>比赛策略</h2>
        <div class="strategy-grid">
          <label>
            起跑
            <select id="startStrategy">
              <option value="safe">保守起跑</option>
              <option value="normal" selected>正常起跑</option>
              <option value="risky">抢起跑</option>
            </select>
          </label>
          <label>
            中段
            <select id="middleStrategy">
              <option value="conserve">保存体力</option>
              <option value="steady" selected>稳定巡航</option>
              <option value="push">主动加速</option>
            </select>
          </label>
          <label>
            冲刺
            <select id="sprintStrategy">
              <option value="early">早冲</option>
              <option value="normal" selected>标准</option>
              <option value="late">晚冲</option>
            </select>
          </label>
        </div>
      </article>
    </section>

    <section class="panel">
      <article class="card">
        <h2 id="cardTitleA">小蓝兔</h2>
        <div class="stats" id="statsA"></div>
      </article>
      <article class="card">
        <h2 id="cardTitleB">对手席</h2>
        <div class="stats" id="statsB"></div>
      </article>
    </section>

    <div class="event-log" id="eventLog">进房后提交你的选手，双方准备即会生成同一场回放。</div>
    <div class="result" id="result"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/duel-room.js?v=20260721-3"></script>
  <script>
    const raceBtn = document.getElementById('raceBtn');
    const arena = document.querySelector('.arena');
    const runnerA = document.getElementById('runnerA');
    const runnerB = document.getElementById('runnerB');
    const courseLayerA = document.getElementById('courseLayerA');
    const courseLayerB = document.getElementById('courseLayerB');
    const nameA = document.getElementById('nameA');
    const nameB = document.getElementById('nameB');
    const statsA = document.getElementById('statsA');
    const statsB = document.getElementById('statsB');
    const eventLog = document.getElementById('eventLog');
    const resultBox = document.getElementById('result');
    const postMatchActions = document.getElementById('postMatchActions');
    const postMatchRematch = document.getElementById('postMatchRematch');
    const statControls = document.getElementById('statControls');
    const pointsBadge = document.getElementById('pointsBadge');
    const runnerName = document.getElementById('runnerName');
    const startStrategy = document.getElementById('startStrategy');
    const middleStrategy = document.getElementById('middleStrategy');
    const sprintStrategy = document.getElementById('sprintStrategy');
    const createdTrait = document.getElementById('createdTrait');
    const environmentBadge = document.getElementById('environmentBadge');
    const cardTitleA = document.getElementById('cardTitleA');
    const cardTitleB = document.getElementById('cardTitleB');
    const duelPlayerName = document.getElementById('duelPlayerName');
    const duelRoomId = document.getElementById('duelRoomId');
    const joinDuelBtn = document.getElementById('joinDuelBtn');
    const createDuelBtn = document.getElementById('createDuelBtn');
    const joinedDuelActions = document.getElementById('joinedDuelActions');
    const shareDuelBtn = document.getElementById('shareDuelBtn');
    const leaveDuelBtn = document.getElementById('leaveDuelBtn');
    const cancelReadyBtn = document.getElementById('cancelReadyBtn');
    const duelStatusText = document.getElementById('duelStatusText');
    const duelSeats = document.getElementById('duelSeats');
    const duelRoomDock = document.querySelector('.duel-room-dock');
    prefillDuelRoomFromQuery(duelRoomId);
    duelPlayerName.value = suggestedDuelPlayerName();
    runnerName.value = `${duelPlayerName.value}豆`;
    let lastPlayedSessionId = '';
    let currentDuelState = null;
    let currentDuelPlayerId = '';
    let replayPlaying = false;

    const duelClient = createDuelRoomClient({
      gameId: 'bean-sprint',
      onConnection(connected) {
        if (!connected) {
          duelStatusText.textContent = '连接断开，正在重连…';
          raceBtn.disabled = true;
        }
      },
      onJoined({ roomId }) {
        duelRoomId.value = roomId;
        setRoomIdentityLocked(true);
        duelStatusText.textContent = `房间 ${roomId} · 调好选手后点准备`;
        const url = new URL(location.href);
        url.searchParams.set('room', roomId);
        url.searchParams.delete('intent');
        history.replaceState(null, '', url);
        updatePreview();
      },
      onState(state, playerId) {
        currentDuelState = state;
        currentDuelPlayerId = playerId;
        renderDuelRoomState(state, playerId);
        if (state.result && state.sessionId && state.sessionId !== lastPlayedSessionId) {
          lastPlayedSessionId = state.sessionId;
          replayPlaying = true;
          renderDuelRoomState(state, playerId);
          playDuelResult(state.result).finally(() => {
            replayPlaying = false;
            renderDuelRoomState(currentDuelState, currentDuelPlayerId);
          });
        }
      },
      onLeft() {
        currentDuelState = null;
        currentDuelPlayerId = '';
        replayPlaying = false;
        postMatchActions.classList.add('hidden');
        setRoomIdentityLocked(false);
        duelRoomId.value = '';
        duelSeats.innerHTML = '';
        duelStatusText.textContent = '已离开房间，可以重新开房或加入。';
        raceBtn.disabled = true;
        setConfigLocked(false);
      },
      onError(message) {
        duelStatusText.textContent = message;
        joinDuelBtn.disabled = false;
        joinDuelBtn.textContent = '按邀请码加入';
        createDuelBtn.disabled = false;
        createDuelBtn.textContent = '快速开房';
        raceBtn.disabled = !duelClient.isJoined() || statTotal() > 36;
      }
    });

    function renderDuelRoomState(state, playerId) {
      duelSeats.innerHTML = state.players.map((player) => {
        const classes = ['duel-seat'];
        if (player.id === playerId) classes.push('is-me');
        if (player.ready && state.phase !== 'finished') classes.push('is-ready');
        if (player.connectionStatus !== 'online') classes.push('is-offline');
        const suffix = player.id === playerId ? '（你）' : '';
        const role = player.isHost ? '<small>房主</small>' : '';
        const status = player.connectionStatus !== 'online'
          ? '· 离线'
          : state.phase === 'finished'
            ? '· 本局完成'
            : player.ready ? '· 已准备' : '· 配置中';
        return `<span class="${classes.join(' ')}">${escapeHTML(player.name)}${suffix}${role}<em>${status}</em></span>`;
      }).join('');
      const prompt = duelReadinessPrompt(state, playerId);
      const me = prompt.me;
      const canChooseNextStep = state.phase === 'finished' && state.sessionId === lastPlayedSessionId && !replayPlaying;
      const postMatchWasHidden = postMatchActions.classList.contains('hidden');
      postMatchActions.classList.toggle('hidden', !canChooseNextStep);
      if (canChooseNextStep && postMatchWasHidden) {
        requestAnimationFrame(() => postMatchActions.scrollIntoView({
          behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
          block: 'nearest'
        }));
      }
      const configurationFrozen = state.phase === 'configuring' && Boolean(me?.ready);
      raceBtn.disabled = !duelClient.isJoined() || !prompt.bothPresent || statTotal() > 36 || configurationFrozen || state.phase === 'running' || replayPlaying;
      setConfigLocked(configurationFrozen || state.phase === 'running' || replayPlaying);
      cancelReadyBtn.classList.toggle('hidden', !configurationFrozen);
      const callToReady = prompt.needsReady && !raceBtn.disabled;
      raceBtn.classList.toggle('duel-ready-callout', callToReady);
      document.body.classList.toggle('has-duel-callout', callToReady);
      duelRoomDock.classList.toggle('is-action-required', callToReady);
      duelStatusText.parentElement.classList.toggle('is-action-required', callToReady);
      raceBtn.textContent = replayPlaying
        ? '比赛回放中…'
        : state.phase === 'finished'
        ? '提交配置，准备下一局'
        : me?.ready
          ? '已准备 · 等对手'
          : prompt.opponentReady
            ? '对手已准备 · 轮到你！'
            : prompt.bothPresent
              ? '两人到齐 · 提交配置并准备'
              : '提交配置并准备';
      if (replayPlaying) {
        duelStatusText.textContent = `第 ${state.round} 局正在回放，看完后可以再来一局。`;
      } else if (!prompt.bothPresent) {
        duelStatusText.textContent = '已进房，等待第二名玩家。';
      } else if (state.phase === 'finished') {
        duelStatusText.textContent = `第 ${state.round} 局已结束，任意一方可先配好下一局。`;
      } else if (state.players.every((player) => player.ready)) {
        duelStatusText.textContent = '双方已准备，正在生成同一场比赛…';
      } else if (me?.ready) {
        duelStatusText.textContent = '你已准备，等待对手提交配置。';
      } else if (prompt.opponentReady) {
        duelStatusText.textContent = '对手已经准备好，点击醒目按钮就能开赛。';
      } else {
        duelStatusText.textContent = '两人已到齐，配置确认后点击醒目按钮准备。';
      }
    }

    const traitNames = {
      rocket_start: '火箭起跑',
      late_beast: '后程怪物',
      steady_machine: '稳定机器',
      big_heart: '大心脏',
      gambler: '赌徒',
      rhythm_master: '节奏大师',
      light_feet: '轻盈步伐',
      iron_lungs: '铁肺',
      front_runner: '领跑者',
      chaser: '追击者',
      clean_steps: '干净步伐',
      photo_finish: '压线之王'
    };

    const traitDescriptions = {
      rocket_start: '前段爆发强，后段略吃力',
      late_beast: '后程冲刺更有威胁',
      steady_machine: '波动和失误更少',
      big_heart: '落后时更容易追上来',
      gambler: '可能突然爆发，也可能失速',
      rhythm_master: '中段节奏更稳定',
      light_feet: '速度灵活，但失误代价更高',
      iron_lungs: '冲刺时体力消耗更低',
      front_runner: '领先时更容易保持节奏',
      chaser: '跟跑追击能力更强',
      clean_steps: '湿滑或抢跑时更稳',
      photo_finish: '最后压线能力更强'

    const eventLabels = {
      grit: '追赶',
      surge: '节奏',
      pressure: '压力',
      curve: '弯道',
      hurdle: '小栏',
      puddle: '水坑',
      cone: '路标',
      gambler_high: '爆发',
      gambler_low: '失速',
      mistake: '失误',
      finish: '冲线'
    };

    const eventDescriptions = {
      grit: '胆量触发，短时间加速追赶',
      surge: '落后方找回步频，缩小差距',
      pressure: '领先方脚步发紧，速度下降',
      curve: '路线变弯，稳定和节奏更重要',
      hurdle: '跨栏会考验爆发和反应',
      puddle: '水坑会考验稳定和步伐',
      cone: '绕开路标会考验反应',
      gambler_high: '赌徒天赋带来短暂爆发',
      gambler_low: '赌徒天赋反噬，短暂失速',
      mistake: '稳定不足导致速度被压低',
      finish: '到达终点，锁定结果'
    };

    const effectDescriptions = {
      hop: '爆发/反应较好，跳过更利落',
      clean: '稳定或干净步伐生效，几乎不乱',
      dodge: '反应或轻盈步伐生效，绕行更快',
      splash: '正常通过，有轻微减速',
      slip: '稳定不足，出现打滑',
      stumble: '处理不佳，明显踉跄'
    };

    const statLabels = {
      burst: '爆发',
      speed: '速度',
      stamina: '耐力',
      stability: '稳定',
      reaction: '反应',
      grit: '胆量'
    };

    const environmentNames = {
      clear_track: '普通跑道',
      tailwind: '顺风',
      wet_track: '湿滑跑道',
      loud_crowd: '观众欢呼'
    };

    const environmentDescriptions = {
      clear_track: '稳定发挥',
      tailwind: '全程略快，后段更省力',
      wet_track: '更容易失误，稳定更重要',
      loud_crowd: '反应和后段胆量更有用'
    };

    const userStats = {
      burst: 8,
      speed: 7,
      stamina: 5,
      stability: 6,
      reaction: 7,
      grit: 3
    };

    let activeCourse = null;

    const defaultRival = {
      name: '红豆',
      stats: { burst: 4, speed: 7, stamina: 8, stability: 6, reaction: 5, grit: 6 },
      strategy: { start: 'safe', middle: 'conserve', sprint: 'late' }
    };

    function runnerTemplate(name, stats, strategy, seed) {
      return { name, stats, strategy, seed };
    }

    function randomSeed() {
      return Math.floor(Math.random() * 1_000_000_000);
    }

    function renderStats(node, runner) {
      node.innerHTML = Object.entries(runner.stats).map(([key, value]) => (
        `<div class="stat">${statLabels[key]} ${value}</div>`
      )).join('');
    }

    function renderControls() {
      statControls.innerHTML = Object.entries(userStats).map(([key, value]) => `
        <div class="stat-control">
          <strong>${statLabels[key]}</strong>
          <div class="stepper">
            <button type="button" data-stat="${key}" data-delta="-1" aria-label="${statLabels[key]} 减少">−</button>
            <span>${value}</span>
            <button type="button" data-stat="${key}" data-delta="1" aria-label="${statLabels[key]} 增加">+</button>
          </div>
        </div>
      `).join('');
      updatePreview();
    }

    function statTotal() {
      return Object.values(userStats).reduce((sum, value) => sum + value, 0);
    }

    function updatePreview() {
      const total = statTotal();
      pointsBadge.textContent = `点数 ${total} / 36`;
      pointsBadge.classList.toggle('is-over', total > 36);
      const me = currentDuelState?.players.find((player) => player.id === duelClient.playerId());
      const frozen = currentDuelState?.phase === 'configuring' && Boolean(me?.ready);
      const bothPresent = duelReadinessPrompt(currentDuelState, duelClient.playerId()).bothPresent;
      raceBtn.disabled = total > 36 || !duelClient.isJoined() || !bothPresent || frozen || currentDuelState?.phase === 'running' || replayPlaying;
      const name = cleanName();
      cardTitleA.textContent = name;
      nameA.innerHTML = `${name} <span>等待中</span>`;
      renderStats(statsA, { stats: userStats });
      statsB.innerHTML = '<div class="stat">等待对手提交配置</div>';
      cardTitleB.textContent = '对手席';
      runnerA.classList.remove('running', 'winner');
      runnerB.classList.remove('running', 'winner');
      clearAction(runnerA);
      clearAction(runnerB);
      activeCourse = null;
      renderCourse(null);
      setMood(runnerA, 'focus');
      setMood(runnerB, 'focus');
      setPosition(runnerA, 0);
      setPosition(runnerB, 0);
    }

    function cleanName() {
      return runnerName.value.trim() || `${duelPlayerName.value.trim()}豆`;
    }

    function setRoomIdentityLocked(locked) {
      duelPlayerName.disabled = locked;
      duelRoomId.disabled = locked;
      createDuelBtn.classList.toggle('hidden', locked);
      joinDuelBtn.classList.toggle('hidden', locked);
      joinedDuelActions.classList.toggle('hidden', !locked);
      if (!locked) {
        createDuelBtn.disabled = false;
        createDuelBtn.textContent = '快速开房';
        joinDuelBtn.disabled = false;
        joinDuelBtn.textContent = '按邀请码加入';
      }
    }

    function setConfigLocked(locked) {
      runnerName.disabled = locked;
      startStrategy.disabled = locked;
      middleStrategy.disabled = locked;
      sprintStrategy.disabled = locked;
      statControls.querySelectorAll('button').forEach(button => { button.disabled = locked; });
      document.querySelector('.builder')?.classList.toggle('is-config-locked', locked);
    }

    function currentStrategy() {
      return {
        start: startStrategy.value,
        middle: middleStrategy.value,
        sprint: sprintStrategy.value
      };
    }

    async function postJSON(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || response.statusText);
      }
      return response.json();
    }

    async function startRace() {
      if (statTotal() > 36) {
        eventLog.textContent = '点数超过 36 了，先减一点再开跑。';
        return;
      }
      raceBtn.disabled = true;
      resultBox.textContent = '';
      setEnvironmentClass(arena, null);
      activeCourse = null;
      renderCourse(null);
      environmentBadge.textContent = '赛场：生成中...';
      eventLog.textContent = '选手热身中...';
      runnerA.classList.remove('running', 'winner');
      runnerB.classList.remove('running', 'winner');
      clearAction(runnerA);
      clearAction(runnerB);
      setMood(runnerA, 'focus');
      setMood(runnerB, 'focus');
      setPosition(runnerA, 0);
      setPosition(runnerB, 0);

      try {
        duelClient.ready({
          name: cleanName(),
          stats: { ...userStats },
          strategy: currentStrategy()
        });
        eventLog.textContent = '配置已提交，等对手准备…';
      } catch (error) {
        eventLog.textContent = '准备失败：' + error.message;
        raceBtn.disabled = false;
      }
    }

    async function playDuelResult(result) {
      const [blue, red] = result.players || [];
      const match = result.match;
      if (!blue || !red || !match) return;
      renderStats(statsA, blue);
      renderStats(statsB, red);
      cardTitleA.textContent = blue.name;
      cardTitleB.textContent = red.name;
      nameA.innerHTML = `${escapeHTML(blue.name)} <span>${traitNames[blue.trait] || blue.trait}</span>`;
      nameB.innerHTML = `${escapeHTML(red.name)} <span>${traitNames[red.trait] || red.trait}</span>`;
      const mine = blue.id === duelClient.playerId() ? blue : red.id === duelClient.playerId() ? red : null;
      if (mine) createdTrait.textContent = `你的天赋：${traitLabel(mine.trait)} · ${traitDescription(mine.trait)}`;
      setEnvironmentClass(arena, match.environment);
      activeCourse = match.course || null;
      renderCourse(activeCourse);
      environmentBadge.textContent = `赛场：${environmentLabel(match.environment)} · ${courseLabel(activeCourse)}`;
      await playReplay(match, blue, red);
    }

    function setPosition(node, meters) {
      const arena = document.querySelector('.arena');
      const width = arena.clientWidth - 112;
      const route = routePoint(meters);
      const x = route.x / 100 * width;
      const layerHeight = Math.max(1, courseLayerA.clientHeight);
      const y = (route.y - 50) / 100 * layerHeight;
      node.style.transform = `translate(${x}px, ${y}px)`;
    }

    function renderCourse(course) {
      [courseLayerA, courseLayerB].forEach((layer) => {
        layer.innerHTML = '';
        if (!course) return;
        const points = normalizedPath(course);
        const pointString = points.map(point => `${point.x},${point.y}`).join(' ');
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'course-svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.innerHTML = `<polyline class="track-edge" points="${pointString}"></polyline><polyline class="track-bed" points="${pointString}"></polyline><polyline class="track-inner" points="${pointString}"></polyline><polyline class="course-path" points="${pointString}"></polyline>`;
        layer.appendChild(svg);
        points.slice(1, -1).forEach((point) => {
          const turn = document.createElement('span');
          turn.className = 'route-turn';
          turn.style.left = `${point.x}%`;
          turn.style.top = `${point.y}%`;
          layer.appendChild(turn);
        });
        const finishPoint = points[points.length - 1];
        const finish = document.createElement('span');
        finish.className = 'route-finish';
        finish.style.left = `${finishPoint.x}%`;
        finish.style.top = `${finishPoint.y}%`;
        layer.appendChild(finish);
        (course.obstacles || []).forEach((obstacle) => {
          const point = routePoint(obstacle.position, course);
          const marker = document.createElement('span');
          marker.className = `obstacle ${obstacle.kind}`;
          marker.style.left = `${point.x}%`;
          marker.style.top = `${point.y}%`;
          marker.dataset.kind = obstacle.kind;
          marker.dataset.position = String(obstacle.position);
          marker.title = obstacleName(obstacle.kind);
          layer.appendChild(marker);
        });
      });
    }

    function normalizedPath(course = activeCourse) {
      const path = course && Array.isArray(course.path) && course.path.length >= 2 ? course.path : null;
      return path || [
        { meter: 0, x: 0, y: 50 },
        { meter: 100, x: 100, y: 50 }
      ];
    }

    function routePoint(meters, course = activeCourse) {
      const path = normalizedPath(course);
      const clamped = Math.max(0, Math.min(100, meters));
      for (let i = 1; i < path.length; i++) {
        const prev = path[i - 1];
        const next = path[i];
        if (clamped <= next.meter) {
          const span = Math.max(1, next.meter - prev.meter);
          const progress = (clamped - prev.meter) / span;
          return {
            x: prev.x + (next.x - prev.x) * progress,
            y: prev.y + (next.y - prev.y) * progress
          };
        }
      }
      const last = path[path.length - 1];
      return { x: last.x, y: last.y };
    }

    function playReplay(match, blue, red) {
      return new Promise((resolve) => {
        const frames = match.frames;
        const events = match.events || [];
        let frameIndex = 0;
        let eventIndex = 0;
        const moodUntil = { a: null, b: null };
        runnerA.classList.add('running');
        runnerB.classList.add('running');
        setMood(runnerA, 'focus');
        setMood(runnerB, 'focus');
        eventLog.textContent = `砰！出发！${environmentLabel(match.environment)}`;

        const timer = setInterval(() => {
          const frame = frames[frameIndex];
          if (!frame) {
            clearInterval(timer);
            runnerA.classList.remove('running');
            runnerB.classList.remove('running');
            const winnerName = match.winner === blue.id ? blue.name : red.name;
            const label = match.reason === 'finish' ? '冲线获胜' : '终局判定';
            resultBox.innerHTML = `${escapeHTML(winnerName)} ${label}${raceRecap(match, blue, red)}`;
            const winnerNode = match.winner === blue.id ? runnerA : runnerB;
            const loserNode = match.winner === blue.id ? runnerB : runnerA;
            winnerNode.classList.add('winner');
            setMood(winnerNode, 'happy');
            setMood(loserNode, 'shame');
            resolve();
            return;
          }

          setPosition(runnerA, frame.a.position);
          setPosition(runnerB, frame.b.position);
          applyFrameMood(runnerA, frame.a, frame.b, frame.tick, moodUntil.a);
          applyFrameMood(runnerB, frame.b, frame.a, frame.tick, moodUntil.b);

          while (events[eventIndex] && events[eventIndex].tick <= frame.tick) {
            const event = events[eventIndex];
            const who = event.runner === blue.id ? blue.name : red.name;
            eventLog.innerHTML = eventText(event.type, who, event.message, event);
            const actorKey = event.runner === blue.id ? 'a' : 'b';
            const actorNode = actorKey === 'a' ? runnerA : runnerB;
            const otherNode = actorKey === 'a' ? runnerB : runnerA;
            const mood = eventMood(event.type);
            setMood(actorNode, mood);
            moodUntil[actorKey] = { mood, until: event.tick + 10 };
            if (isObstacleEvent(event.type)) {
              triggerObstacleAction(actorNode, actorKey === 'a' ? courseLayerA : courseLayerB, event, actorKey === 'a' ? frame.a.position : frame.b.position);
              const otherKey = actorKey === 'a' ? 'b' : 'a';
              const obstacleMood = randomObstacleMood(event.effect);
              const otherMood = randomOpponentObstacleMood(event.effect);
              setMood(actorNode, obstacleMood);
              setMood(otherNode, otherMood);
              moodUntil[actorKey] = { mood: obstacleMood, until: event.tick + 14 };
              moodUntil[otherKey] = { mood: otherMood, until: event.tick + 8 };
            }
            if (event.type === 'surge' || event.type === 'grit' || event.type === 'finish') {
              const otherKey = actorKey === 'a' ? 'b' : 'a';
              setMood(otherNode, 'strain');
              moodUntil[otherKey] = { mood: 'strain', until: event.tick + 6 };
            }
            eventIndex++;
          }

          frameIndex++;
        }, 50);
      });
    }

    function applyFrameMood(node, self, opponent, tick, lockedMood) {
      if (lockedMood && tick <= lockedMood.until) {
        setMood(node, lockedMood.mood);
        return;
      }
      if (self.energy < 26 && tick % 12 < 6) {
        setMood(node, 'strain');
        return;
      }
      setMood(node, 'focus');
    }

    function eventMood(type) {
      if (type === 'finish' || type === 'gambler_high') return 'happy';
      if (type === 'surge' || type === 'grit') return 'determined';
      if (type === 'pressure') return 'shocked';
      if (type === 'mistake' || type === 'gambler_low') return 'dizzy';
      if (type === 'hurdle' || type === 'puddle' || type === 'cone' || type === 'curve') return 'angry';
      return 'strain';
    }

    function isObstacleEvent(type) {
      return type === 'hurdle' || type === 'puddle' || type === 'cone';
    }

    function triggerObstacleAction(node, layer, event, meters) {
      const effect = event.effect || defaultObstacleEffect(event.type);
      const action = ['hop', 'dodge', 'clean', 'splash', 'slip', 'stumble'].includes(effect) ? effect : 'stumble';
      clearAction(node);
      node.classList.add(`action-${action}`);
      flashObstacle(layer, event.type, meters, action);
      showEffectPop(layer, meters, actionText(effect, event.type), isBadObstacleEffect(effect));
      window.setTimeout(() => clearAction(node), 720);
    }

    function clearAction(node) {
      node.classList.remove('action-hop', 'action-dodge', 'action-clean', 'action-splash', 'action-slip', 'action-stumble');
    }

    function flashObstacle(layer, type, meters, action) {
      const markers = [...layer.querySelectorAll(`.obstacle.${type}`)];
      const marker = markers
        .map(item => ({ item, distance: Math.abs(Number(item.dataset.position || 0) - meters) }))
        .sort((a, b) => a.distance - b.distance)[0]?.item;
      if (!marker) return;
      marker.classList.remove('is-hit', 'flash-hop', 'flash-clean', 'flash-dodge', 'flash-splash', 'flash-slip', 'flash-stumble');
      void marker.offsetWidth;
      marker.classList.add('is-hit', `flash-${action}`);
      window.setTimeout(() => {
        marker.classList.remove('is-hit', `flash-${action}`);
      }, 780);
    }

    function showEffectPop(layer, meters, text, bad = false) {
      const point = routePoint(meters);
      const pop = document.createElement('span');
      pop.className = `effect-pop ${bad ? 'bad' : 'good'}`;
      pop.textContent = text;
      pop.style.left = `${point.x}%`;
      pop.style.top = `${point.y}%`;
      layer.appendChild(pop);
      window.setTimeout(() => pop.remove(), 820);
    }

    function defaultObstacleEffect(type) {
      if (type === 'hurdle') return 'hop';
      if (type === 'puddle') return 'splash';
      if (type === 'cone') return 'dodge';
      return 'stumble';
    }

    function isBadObstacleEffect(effect) {
      return effect === 'slip' || effect === 'stumble';
    }

    function randomObstacleMood(effect) {
      const moods = isBadObstacleEffect(effect)
        ? ['dizzy', 'panic', 'shame', 'shocked']
        : ['proud', 'happy', 'determined', 'taunt'];
      return randomChoice(moods);
    }

    function randomOpponentObstacleMood(effect) {
      const moods = isBadObstacleEffect(effect)
        ? ['taunt', 'proud', 'happy']
        : ['shocked', 'panic', 'angry', 'determined'];
      return randomChoice(moods);
    }

    function randomChoice(values) {
      return values[Math.floor(Math.random() * values.length)];
    }

    function actionText(effect, type) {
      const labels = {
        hop: '跳过',
        clean: '稳稳过',
        dodge: '灵巧绕',
        splash: '水花',
        slip: '打滑',
        stumble: '踉跄'
      };
      return labels[effect] || obstacleName(type);
    }

    function setMood(node, mood) {
      node.classList.remove('mood-focus', 'mood-strain', 'mood-angry', 'mood-happy', 'mood-shame', 'mood-taunt', 'mood-panic', 'mood-determined', 'mood-proud', 'mood-shocked', 'mood-dizzy');
      node.classList.add(`mood-${mood}`);
    }

    function traitLabel(trait) {
      return traitNames[trait] || trait;
    }

    function traitDescription(trait) {
      return traitDescriptions[trait] || '带来特殊比赛波动';
    }

    function eventText(type, who, message) {
      const label = eventLabels[type] || '事件';
      const detail = eventDescriptions[type];
      const suffixParts = [];
      if (detail) suffixParts.push(detail);
      const currentEvent = arguments.length > 3 ? arguments[3] : null;
      if (currentEvent && currentEvent.effect && effectDescriptions[currentEvent.effect]) {
        suffixParts.push(effectDescriptions[currentEvent.effect]);
      }
      const suffix = suffixParts.length ? ` · ${suffixParts.join(' · ')}` : '';
      return `<strong>${escapeHTML(label)}</strong>${escapeHTML(who)}：${escapeHTML(message)}${escapeHTML(suffix)}`;
    }

    function raceRecap(match, blue, red) {
      const winner = match.winner === blue.id ? blue : red;
      const loser = match.winner === blue.id ? red : blue;
      const last = match.frames[match.frames.length - 1];
      const winnerFrame = match.winner === blue.id ? last.a : last.b;
      const loserFrame = match.winner === blue.id ? last.b : last.a;
      const finalGap = Math.abs(winnerFrame.position - loserFrame.position).toFixed(1);
      const keyEvent = strongestRaceEvent(match.events || [], winner.id);
      const stat = bestRunnerStat(winner.stats);
      const traitLine = `${winner.name} 的「${traitLabel(winner.trait)}」${traitDescription(winner.trait)}。`;
      const keyLine = keyEvent ? `关键转折是 ${keyEvent.time.toFixed(2)}s 的「${keyEvent.message}」。` : `关键在 ${statLabels[stat]} 属性，${winner.name} 后段更稳。`;
      const gapLine = match.reason === 'finish'
        ? `最终领先约 ${finalGap}m 冲线，${loser.name} 需要补强${statLabels[bestRunnerStat(loser.stats)]}或调整冲刺策略。`
        : `比赛进入终局判定，${winner.name} 靠整体位置和后段能力占优。`;
      return `<div class="recap"><strong class="recap-title">赛后复盘</strong><p>${escapeHTML(traitLine)}</p><p>${escapeHTML(keyLine)}</p><p>${escapeHTML(gapLine)}</p></div>`;
    }

    function strongestRaceEvent(events, winnerId) {
      const priority = ['finish', 'surge', 'grit', 'gambler_high', 'hurdle', 'puddle', 'cone', 'curve', 'pressure', 'mistake', 'gambler_low'];
      return priority
        .map(type => events.find(event => event.type === type && (event.runner === winnerId || type === 'pressure' || type === 'mistake' || type === 'gambler_low')))
        .find(Boolean);
    }

    function bestRunnerStat(stats) {
      return Object.entries(stats).sort((a, b) => b[1] - a[1])[0][0];
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function environmentLabel(environment) {
      const name = environmentNames[environment] || environment || '未知赛场';
      const description = environmentDescriptions[environment];
      return description ? `${name} · ${description}` : name;
    }

    function courseLabel(course) {
      if (!course) return '路线生成中';
      const shape = course.shape || '路线';
      return `${shape} · 障碍 ${(course.obstacles || []).length} · 弯道 ${(course.curves || []).length}`;
    }

    function obstacleName(kind) {
      const names = {
        hurdle: '小栏',
        puddle: '水坑',
        cone: '路标'
      };
      return names[kind] || '障碍';
    }

    function setEnvironmentClass(node, environment) {
      node.classList.remove('env-clear_track', 'env-tailwind', 'env-wet_track', 'env-loud_crowd');
      if (environment) {
        node.classList.add(`env-${environment}`);
      }
    }

    statControls.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-stat]');
      if (!button) return;
      const key = button.dataset.stat;
      const delta = Number(button.dataset.delta);
      const next = Math.max(1, Math.min(10, userStats[key] + delta));
      if (next === userStats[key]) return;
      userStats[key] = next;
      renderControls();
    });
    runnerName.addEventListener('input', updatePreview);
    startStrategy.addEventListener('change', updatePreview);
    middleStrategy.addEventListener('change', updatePreview);
    sprintStrategy.addEventListener('change', updatePreview);
    joinDuelBtn.addEventListener('click', () => {
      if (!duelRoomId.value.trim()) {
        duelStatusText.textContent = '请先输入邀请码。';
        duelRoomId.focus();
        return;
      }
      joinDuelBtn.disabled = true;
      joinDuelBtn.textContent = '进房中…';
      duelClient.join(duelRoomId.value, duelPlayerName.value);
    });
    createDuelBtn.addEventListener('click', () => {
      createDuelBtn.disabled = true;
      createDuelBtn.textContent = '开房中…';
      duelClient.create(duelPlayerName.value);
    });
    shareDuelBtn.addEventListener('click', async () => {
      const inviteURL = new URL(location.pathname, location.origin);
      inviteURL.searchParams.set('room', duelRoomId.value);
      try {
        await navigator.clipboard.writeText(inviteURL.toString());
        shareDuelBtn.textContent = '链接已复制';
      } catch (error) {
        console.error('复制邀请链接失败', error);
        shareDuelBtn.textContent = '复制失败';
      }
      setTimeout(() => { shareDuelBtn.textContent = '复制邀请链接'; }, 1400);
    });
    leaveDuelBtn.addEventListener('click', () => duelClient.leave());
    cancelReadyBtn.addEventListener('click', () => duelClient.cancelReady());
    duelPlayerName.addEventListener('input', () => {
      if (!runnerName.dataset.customized) runnerName.value = `${duelPlayerName.value.trim()}豆`;
      updatePreview();
    });
    runnerName.addEventListener('input', () => { runnerName.dataset.customized = 'true'; });
    postMatchRematch.addEventListener('click', () => {
      document.querySelector('.builder')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      runnerName.focus({ preventScroll: true });
    });
    renderControls();
    raceBtn.addEventListener('click', startRace);
    if (new URLSearchParams(location.search).get('intent') === 'create') {
      requestAnimationFrame(() => createDuelBtn.click());
    }
  </script>
</body>
</html>
